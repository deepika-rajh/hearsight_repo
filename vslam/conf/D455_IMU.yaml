%YAML:1.0
---
# Camera_in_IMU below is real factory data from this unit's
# `rs-enumerate-devices -c` (the "Color" -> "Gyro" extrinsic block: RealSense's
# "Extrinsic from Color to Gyro" is p_gyro = R*p_color + T, i.e. exactly the
# camera-pose-in-IMU-frame this field expects). Accel and Gyro are the same
# physical die on the D455 (Gyro<->Accel extrinsic is identity/zero in the
# dump), so this one transform is used for both.
#
# Accelerator_bias / Gyro_bias are still PLACEHOLDER zeros: this unit's
# "Motion Intrinsic" block reports Bias Variances = 0 for both Accel and
# Gyro, meaning the device doesn't expose a factory bias value (not that the
# true bias is zero). For better accuracy, do a short stationary capture (a
# few seconds at rest, average each axis - expect ~0 for gyro, ~9.8 on the
# vertical accel axis) or run a proper IMU-camera calibration (e.g. Kalibr).
#
# delta (IMU clock vs camera clock offset) is left at 0, assuming
# unite_imu_method + the realsense-ros driver keep both on the same
# hardware-timestamped clock. Adjust if fusion drifts/lags in practice.
imu_name: D455_IMU
Accelerator_bias:
   rows: 1
   cols: 3
   data: [ 0., 0., 0. ]
Gyro_bias:
   rows: 1
   cols: 3
   data: [ 0., 0., 0. ]
Camera_in_IMU:
   rows: 3
   cols: 4
   data: [ 9.9999400000000000e-01, -2.9031300000000002e-03, -1.8298300000000001e-03, 2.8912356123328200e-02,
       2.9021100000000001e-03, 9.9999600000000000e-01, -5.6118800000000003e-04, 7.5386269018054000e-03,
       1.8314500000000000e-03, 5.5587400000000005e-04, 9.9999800000000000e-01, 1.5736430883407600e-02 ]
delta: 0.
