#Relative path of the map to the working directory
MapPath map
#Map Name
MapName 8009Map
#Maximum key frame number
MaxKeyFrame          20000

# This rig has no wheel odom or external odometry at all - camera+IMU only.
alwaysDoMappingOnRobotOdom 0

launchVM  1
# Max depth to trust, in mm - matches the DFS depthRange.maxDepth set in
# InputStereoCameraROS2's initDFS() (keep these two in sync if you change one).
depthFilter 5000

#LS_BASED     CANNY_BASED
WOD_TYPE  CANNY_BASED
WOD_THRE1  0
WODFrameSkip 5
WALL_DETECT 1
FEATURE_DETECT 1
#Enable WOD Log
LOG_ENABLED 1
specialCeilingMode  0

# Target-less parameters
FailVSLAMPoseNumToStartTargetless    5000000000
FailVSLAMPoseNumToRestartTargetless  100
SuccessVSLAMPoseNumToStopTargetless  150
TrajectoryDistanceToStopTargetless 2.0
CountFailNnmAfterSuccessTrack 1

# Scale Verification parameters
ActiveScaleVerification                  1
ScaleVerificationFailFrameNum            50
ScaleVerificationTimes                   1
ScaleVerificationScaleRatioThreshold     0.06
ScaleVerificationDistThresholdLARGE      0.4
ScaleVerificationDistThresholdSAMLL      0.2

InitialIndex        0

CameraFunc           CAM_FUNC_OPTIC_FLOW
ExposureTime         0.1
Gain                 0.1
CaptureMode          PREVIEW
FrameRate            15
FrameType            YUV_FORMAT

#TARGET_INIT TARGETLESS_INIT RELOCALIZATION RELOCALIZATION_DEPTH DEPTH_INIT VSLAM_ONLY
# History of getting here (see git blame / prior comments for the long version):
# STEREO_ONLY/STEREOW_INIT are from the older mvVSLAM_INITMODE enum, not valid
# for rvVWSLAM_Initialize. VSLAM_ONLY is a real rv-family token but the engine
# rejected it for genuine two-camera rvStereo cameraType. TARGETLESS_INIT was
# accepted but never got Tracking Quality off -1/INITIALIZING even with every
# threshold loosened to trivial values - pointed at the rvStereo tracking path
# itself being the problem, not tuning.
# Fix: InputStereoCameraROS2 now computes depth itself from the infra1/infra2
# pair via Qualcomm's own rvDFS (Depth-From-Stereo) API, and feeds
# (left image, computed depth) into the engine as rvGrayDepth - the same
# camera type/code path depth-vslam already uses successfully. DEPTH_INIT is
# the proven-working init mode for that path.
VSLAMIniMode DEPTH_INIT

#CPA_MODE_DISABLED, CPA_MODE_COST, CPA_MODE_HISTOGRAM
CPAMode              CPA_MODE_COST
CPAFrameSkip         4
ExposureCost         0.6
GainCost             0.3
CPAFilterSize        3

enableHistogramCost		1
systemBrightnessMargin	     30
thresholdSaturated   	170
thresholdUnderflowed  50

CPAExposureMin        0.001
CPAExposureSoftMax    0.2
CPAExposureMax        0.2
CPAGainMin            0.001
CPAGainSoftMax        0.3
CPAGainMax            1.0
CPALogEGPStepSizeMin  0.001
CPALogEGPStepSizeMax  1.0

loopClosureEnabled	 1

#Enable wheel or not
wheelEnabled         0
#Enable IMU processing or not
IMUEnabled           1
#0: no autoNavi; 1: autoNavi with pathplanning; 2: autoNavi in init;
autoNavigation       0

#Keep only the current local sub-map or the whole map in memory
onlyVisibleKFImageInMemory  0
# 1: try to relocate and initializate simultaneously
alwaysOnRelocation     0

# Not assuming a ground-robot planar/level rig here (unlike rgbdWSlam.cfg,
# which sets these to 1) since we don't know this platform is height/roll/
# pitch-constrained - leave unconstrained until confirmed otherwise.
useExternalConstraint     0
heightConstraint     0.3
rollConstraint          0.5
pitchConstraint          0.5
inXYPlaneRotationConstraint       0

# 1: treat vslamPose with Bad state as Fail; 0: Bad is not Fail
vslamStateBadAsFail  0

#The oldest key frame will be removed whose distance to current robot location is larger than the removalRadius (in meter)
# > 10000 means the keyframe removal function is disabled
removalRadius     3

# Map Initializer - values below are rgbdWSlam.cfg's (the proven-working
# DEPTH_INIT/rvGrayDepth cfg from earlier this session), not the looser
# diagnostic values used while we were still chasing the (unrelated) rvStereo
# tracking-path problem.
minAngleForRobustPoint             1.146
minAngleForTriangulation           1.146
minAngleForEssentialMatrixPose     1.146
minInitialPoints                   75
maxPointsPerCell                   30
continuousModeEnabled              0
esmEnabled                         0
serachTwice                        0
stopSearchTwiceRatio               -0.2
enabledTukey                       0
fixedMaxTukeyErr                   5.0

maxFramesLost                      10
ratioBufferedPointToInitialPoint   0.5
ratioTrackedPointToInitialPoint    0.2
ratioRobustPointToTrackedPoint     0.0
robustPoint                        15
ratioEssInlinersToTrackedPoint     0.0
essInliners                        20
ratioHomoInlinersToTrackedPoint    0.3
homoInliners                       20

#feature point detector
numLevels                          1
harrisThreshold                    300
maxPointsPerCell4KD                100
maxPoints                          2000
fastThresholdLevel0                80
fastThresholdLevel1                60
fastThresholdLevel2                17
dynamicSuperLowBarrier              7

#1 enabled, 0 disabled
minImagePointParallaxAngle(Dgree) 1.146
maxImagePointProjectError(Pixel)  2.1
maxMapPointProjectError(Pixel)    2.1

mIMUConfPath ./
