/*
    Now only support accel and gyro conf. accel and gryo sample_rate range:
    RB3 GEN2: [12-500] HZ 12 25 50 100 200 500
    If different sensors are configured with the same hardware,
    the frequency of hardware sampling will be the final set.
*/
{
  "version": "1.0",
  "sensors": [
    {
      "sensor_type": "accel",
      "sample_rate": 200
    },
    {
      "sensor_type": "gyro",
      "sample_rate": 200
    }
  ]
}
